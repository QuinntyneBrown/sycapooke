name: Deploy marketing

# Deploys the marketing site (www.<SITE_HOST>) on every push to main once CI (npm run verify) has passed on it,
# independently of the application (ADR platform/0015, L2-084, L2-087). Run by hand with an older commit SHA to
# roll back (L2-086).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA to deploy (empty for the head of the chosen branch)
        required: false
        default: ""

concurrency:
  group: deploy-marketing
  cancel-in-progress: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/quinntynebrown
  DEPLOY_SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check deploy SHA
        run: '[[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full commit SHA"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/marketing/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sycapooke-marketing:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_PREFIX }}/sycapooke-marketing:latest
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SITE_HOST: ${{ secrets.SITE_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Copy compose file and edge config
        run: |
          ssh "azureuser@${DEPLOY_HOST}" mkdir -p /opt/sycapooke/edge
          scp deploy/docker-compose.yml "azureuser@${DEPLOY_HOST}:/opt/sycapooke/docker-compose.yml"
          scp deploy/edge/Caddyfile "azureuser@${DEPLOY_HOST}:/opt/sycapooke/edge/Caddyfile"
      - name: Log in to the registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh "azureuser@${DEPLOY_HOST}" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Restart the marketing site
        run: |
          ssh "azureuser@${DEPLOY_HOST}" bash -s <<'REMOTE'
            set -euo pipefail
            cd /opt/sycapooke
            trap 'docker logout ghcr.io >/dev/null' EXIT
            sed -i '/^MARKETING_TAG=/d' .env && echo "MARKETING_TAG=${{ env.DEPLOY_SHA }}" >> .env
            sed -i '/^SITE_ADDRESS=/d' .env && printf 'SITE_ADDRESS=%s, www.%s, app.%s\n' "${{ env.SITE_HOST }}" "${{ env.SITE_HOST }}" "${{ env.SITE_HOST }}" >> .env
            docker compose pull --quiet marketing edge
            docker compose up -d --no-deps marketing edge
            docker compose exec -T edge caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            docker image prune -af --filter "until=72h" >/dev/null
          REMOTE
      - name: Smoke test marketing
        run: |
          for i in $(seq 1 20); do
            curl -fsS "https://www.${SITE_HOST}/" | grep -q "Sycapooke" && exit 0
            sleep 6
          done
          echo "marketing check failed" && exit 1
