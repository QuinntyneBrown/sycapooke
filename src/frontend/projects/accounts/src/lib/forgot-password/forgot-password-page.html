@if (state() === 'sent') {
  <div>
    <h1>Check your email</h1>
    <p class="text-muted forgot__lead">If an account exists for this email, we’ve sent a link.</p>
  </div>
  <div class="empty__icon forgot__icon"><sy-icon name="mail" size="lg" /></div>
  <div class="stack">
    <a syButton size="lg" [block]="true" routerLink="/sign-in">Back to sign in</a>
  </div>
} @else {
  <div>
    <h1>Reset your password</h1>
    <p class="text-muted forgot__lead">We’ll email you a link that works for 1 hour.</p>
  </div>
  @if (failure() !== null) {
    <sy-alert tone="danger" heading="Couldn’t send the link"
      >Try again in a moment. <span class="ref">{{ failure() }}</span></sy-alert
    >
  }
  <form class="stack stack--lg" novalidate [formGroup]="form" (ngSubmit)="submit()">
    <sy-form-field fieldId="email" label="Email" [error]="emailError()">
      <input
        class="input"
        id="email"
        type="email"
        autocomplete="email"
        formControlName="email"
        [readonly]="state() === 'submitting'"
        [attr.aria-invalid]="emailError() ? 'true' : null"
      />
    </sy-form-field>
    <div class="stack">
      <button syButton="primary" size="lg" [block]="true" type="submit" [busy]="state() === 'submitting'">
        Send reset link
      </button>
      <a syButton="link" routerLink="/sign-in">Back to sign in</a>
    </div>
  </form>
}
