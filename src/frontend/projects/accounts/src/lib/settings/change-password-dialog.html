<sy-dialog heading="Change password">
  <span description>Other devices will be signed out.</span>
  @if (state() === 'failed') {
    <sy-alert top tone="danger" heading="Couldn’t change your password"
      >Try again. <span class="ref">{{ failure() }}</span></sy-alert
    >
  }
  <form class="stack" novalidate [formGroup]="form" (ngSubmit)="submit()">
    <sy-form-field fieldId="current-password" label="Current password" [error]="currentError()">
      <input
        class="input"
        id="current-password"
        type="password"
        autocomplete="current-password"
        data-autofocus
        formControlName="current"
        [attr.aria-invalid]="currentError() ? 'true' : null"
      />
    </sy-form-field>
    <sy-form-field fieldId="new-password" label="New password" help="At least 12 characters." [error]="nextError()">
      <input
        class="input"
        id="new-password"
        type="password"
        autocomplete="new-password"
        formControlName="next"
        [attr.aria-invalid]="nextError() ? 'true' : null"
      />
    </sy-form-field>
  </form>
  <ng-container ngProjectAs="[footer]">
    <button syButton type="button" [disabled]="state() === 'busy'" (click)="ref.close()">Cancel</button>
    <button syButton="primary" type="button" [busy]="state() === 'busy'" (click)="submit()">
      {{ state() === 'failed' ? 'Try again' : 'Change password' }}
    </button>
  </ng-container>
</sy-dialog>
