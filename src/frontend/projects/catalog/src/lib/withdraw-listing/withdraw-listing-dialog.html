<sy-dialog [heading]="'Withdraw “' + data.title + '”?'" icon="trash" tone="danger" size="sm">
  <span description>It leaves the shop right away. This can’t be undone.</span>
  @if (state() === 'failed') {
    <sy-alert top tone="danger" heading="Couldn’t withdraw">Your listing is still live.</sy-alert>
  }
  <ng-container ngProjectAs="[footer]">
    <button syButton type="button" data-autofocus [disabled]="state() === 'busy'" (click)="ref.close()">
      Keep listing
    </button>
    <button syButton="danger" type="button" [busy]="state() === 'busy'" (click)="submit()">
      {{ state() === 'failed' ? 'Try again' : 'Withdraw' }}
    </button>
  </ng-container>
</sy-dialog>
