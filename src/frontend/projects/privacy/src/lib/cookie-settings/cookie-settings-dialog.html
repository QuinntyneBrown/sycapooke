<sy-dialog heading="Cookie settings" size="sm">
  <sy-switch label="Strictly necessary" hint="Sign-in and checkout. Always on." [checked]="true" disabled />
  <sy-switch label="Analytics" hint="Helps us see which pages are slow." [(checked)]="analytics" autofocus />
  <ng-container ngProjectAs="[footer]">
    <button syButton type="button" (click)="ref.close()">Cancel</button>
    <button syButton="primary" type="button" (click)="save()">Save</button>
  </ng-container>
</sy-dialog>
