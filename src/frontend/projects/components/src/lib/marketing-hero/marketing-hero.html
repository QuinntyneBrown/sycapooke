<ng-template #title><ng-content select="[title]" /></ng-template>
<section class="marketing-hero" [attr.aria-labelledby]="headingId()">
  <div class="marketing-hero__inner">
    <div>
      @if (eyebrow()) {
        <p class="marketing-hero__eyebrow">{{ eyebrow() }}</p>
      }
      <h1 class="marketing-hero__title" [id]="headingId()"><ng-container [ngTemplateOutlet]="title" /></h1>
      @if (lede()) {
        <p class="marketing-hero__lede">{{ lede() }}</p>
      }
      <div class="marketing-hero__actions"><ng-content select="[actions]" /></div>
    </div>
    <div class="marketing-hero__media">
      <figure class="marketing-hero__photo"><ng-content select="[media]" /></figure>
    </div>
  </div>
</section>
