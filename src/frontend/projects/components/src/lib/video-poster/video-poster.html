<button class="video-poster" type="button" (click)="watch.emit()">
  <img [src]="poster()" alt="" width="928" height="1152" />
  <span class="video-poster__play">
    <sy-icon name="play" />{{ label() }}
    @if (duration()) {
      <span class="video-poster__meta" aria-hidden="true">· {{ duration() }}</span>
    }
  </span>
</button>
