@if (loading()) {
  <ul class="listing-grid" role="list" aria-busy="true" aria-label="Loading listings">
    @for (i of skeletons; track i) {
      <li>
        <div class="listing-card" aria-hidden="true">
          <span class="skeleton skeleton--photo"></span>
          <div class="listing-card__body">
            <span class="skeleton skeleton--text skeleton--w85"></span>
            <span class="skeleton skeleton--text skeleton--w55"></span>
            <span class="skeleton skeleton--text skeleton--w40"></span>
          </div>
        </div>
      </li>
    }
  </ul>
} @else {
  <ul class="listing-grid" role="list">
    @for (card of cards(); track card.href; let i = $index) {
      <li><sy-listing-card [card]="card" [priority]="i < eagerCount()" /></li>
    }
  </ul>
}
