<ng-template #title><ng-content select="[title]" /></ng-template>
<section
  class="feature-band"
  [class.feature-band--sell]="tone() === 'sell'"
  [class.feature-band--story]="tone() === 'story'"
  [class.feature-band--stacked]="stacked()"
  [class.feature-band--closing]="closing()"
  [attr.aria-labelledby]="headingId()"
>
  <div class="feature-band__inner">
    <div>
      @if (eyebrow()) {
        <p class="feature-band__eyebrow">{{ eyebrow() }}</p>
      }
      <h2 class="feature-band__title" [id]="headingId()">
        @if (heading()) {
          {{ heading() }}
        } @else {
          <ng-container [ngTemplateOutlet]="title" />
        }
      </h2>
      @if (lede()) {
        <p class="feature-band__lede">{{ lede() }}</p>
      }
      <div class="feature-band__actions"><ng-content select="[actions]" /></div>
    </div>
    <div>
      @if (points().length) {
        <ul class="feature-band__points" role="list">
          @for (point of points(); track point.title) {
            <li class="feature-band__point">
              <strong>{{ point.title }}</strong
              ><span>{{ point.text }}</span>
            </li>
          }
        </ul>
      }
      <ng-content />
    </div>
  </div>
</section>
